<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini E-commerce Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      text-align: center;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      padding: 20px;
    }

    .chat-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    iframe {
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    footer {
      margin-top: 30px;
      padding: 15px;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    .badge {
      background: #22c55e;
      color: white;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-left: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 Mini E-commerce Chatbot</h1>
  <p>Find the best products based on your needs</p>
</header>

<div class="container">
  <h2>💬 Chat with our Assistant</h2>
  <p>Select category, budget, and get product suggestions instantly!</p>

  <div class="chat-container">
    <iframe 
      width="400" 
      height="600" 
      src="https://embed.wotnot.io/4TP2SKFgnTuk071037854113svXJyLXd/bot/7aTo3pf37Cqn071024335295JlcMsnv1?display_header=false&history_retention=false" 
      frameborder="0">
    </iframe>
  </div>
</div>

<footer>
  <p>
    Developed by <strong>Ashish Sharma</strong> 
    <span class="badge">AI & Data Science Student</span>
  </p>
  <p>Project: Low-Code Chatbot Deployment (Mini E-commerce Guide Bot)</p>
</footer>

</body>
</html>
